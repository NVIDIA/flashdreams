[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-t2av-ltx25"
version = "0.1.0"
description = "LTX 2.5 synchronized text-to-audio-video application for FlashDreams V2."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.0",
    "diffusers @ git+https://github.com/huggingface/diffusers.git@119c339551f68ea523b9f204120b929e56342421",
    "flashdreams",
]

[tool.uv.sources]
flashdreams = { workspace = true }

[project.entry-points."flashdreams.applications_v2"]
"t2av-ltx25" = "t2av_ltx25.app:create_app"

[project.scripts]
flashdreams-ltx25-benchmark = "t2av_ltx25.benchmark:main"

[tool.setuptools.packages.find]
include = ["t2av_ltx25*"]

[tool.uv]
managed = true
