[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-wan21"
version = "0.1.0"
description = "Wan 2.1 T2V + I2V non-streaming inference plugin for flashdreams."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flashdreams",
    "flashdreams-t2v",
    "mediapy>=1.1",
    "opencv-python-headless>=4.5",
]

[tool.uv.sources]
flashdreams = { workspace = true }
flashdreams-t2v = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

# Bind the reusable T2V application to this model's root config.
[project.entry-points."flashdreams.applications_v2"]
"t2v-wan21" = "wan21.apps.t2v.adapter:create_app"

[tool.setuptools]
packages = ["wan21", "wan21.apps", "wan21.apps.t2v"]

[tool.setuptools.package-dir]
wan21 = "."

[tool.uv]
managed = true
