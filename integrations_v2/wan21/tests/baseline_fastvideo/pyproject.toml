[project]
name = "wan21-fastvideo-parity-check"
version = "0.1.0"
description = "Isolated venv for FastVideo Wan 2.1 parity benchmark."
requires-python = ">=3.10"
dependencies = [
    "imageio[ffmpeg]",
    "aiofiles",
    "aiohttp",
    "av",
    "boto3",
    "botocore",
    "cloudpickle",
    "datasets",
    "diffusers",
    "docstring-parser",
    "einops",
    "fastapi",
    "flask",
    "flask_restful",
    "ftfy",
    "gpustat",
    "gradio",
    "h5py",
    "jmespath",
    "moviepy",
    "omegaconf",
    "opencv-python",
    "pyarrow",
    "protobuf>=7.35.0,<8",
    "ray",
    "remote-pdb",
    "requests",
    "s3transfer",
    "scipy",
    "sentencepiece",
    "test-tube",
    "timm",
    "torchcodec",
    "torchdata",
    "transformers==4.57.3",
    "typeguard",
    "tyro",
    "uvicorn",
    "wandb",
    "watch",
]

[tool.uv]
managed = true
# CVE-2026-59890; PyTorch's <82 cap was unnecessary.
# ponytail: override legacy metadata until all profiles use torch>=2.13.
# https://github.com/pytorch/pytorch/pull/188190
# MoviePy 2.2.1's Pillow cap blocks patched releases; CPU image operations are validated.
# ponytail: remove Pillow override after https://github.com/Zulko/moviepy/pull/2562 ships.
override-dependencies = ["setuptools>=83.0.0,<84", "pillow>=12.3.0,<13"]
build-constraint-dependencies = ["setuptools>=83.0.0,<84"]
# Security floors for HTTP proxy TLS, chunked decoding, and items-view leaks.
constraint-dependencies = ["urllib3>=2.8.0,<3", "multidict>=6.9.1,<7"]
