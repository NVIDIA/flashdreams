[build-system]
requires = ["setuptools>=83.0.0,<84", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-hy-worldplay"
version = "0.1.0"
description = "HY-WorldPlay Cam2V integration for FlashDreams v2."
readme = "README.md"
license = "Apache-2.0 AND MIT AND LicenseRef-Tencent-HunyuanVideo-1.5-Community AND LicenseRef-Tencent-HY-WorldPlay-Community"
license-files = ["LICENSES/*.txt", "NOTICE"]
requires-python = ">=3.10"
# This package includes the adapted source in impl/; license-files carries
# its upstream terms and notices. Model checkpoints are downloaded separately.
dependencies = [
    "flashdreams",
    "flashdreams-cam2v",
    "flashdreams-wan22",
    "diffusers>=0.34",
    "scipy>=1.11",
]

[tool.uv]
managed = true

[tool.uv.sources]
flashdreams = { workspace = true }
flashdreams-cam2v = { workspace = true }
flashdreams-wan22 = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.entry-points."flashdreams.applications_v2"]
"cam2v-hy-worldplay" = "hy_worldplay.apps.cam2v.adapter:create_app"

[tool.setuptools]
packages = [
    "hy_worldplay",
    "hy_worldplay.apps",
    "hy_worldplay.apps.cam2v",
    "hy_worldplay.impl",
]

[tool.setuptools.package-dir]
hy_worldplay = "."
