[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-hy-worldplay"
version = "0.1.0"
description = "HY-WorldPlay Cam2V integration for FlashDreams v2."
readme = "README.md"
requires-python = ">=3.10"
# The upstream HY-WorldPlay model code (``hyvideo/`` and ``wan/``) lives in
# https://github.com/Tencent-Hunyuan/HY-WorldPlay and is *not* on PyPI.
# The recipe wrapper here only provides the FlashDreams-side model and app;
# the upstream tree is provisioned separately and,
# for in-tree slugs, must be installed separately into the venv:
#
#     uv pip install --no-build-isolation -e <path-to-HY-WorldPlay>
#
# We therefore deliberately do NOT list HY-WorldPlay as a dependency here
# (its ``requirements.txt`` pulls heavyweight, version-pinned scientific
# stacks that would conflict with flashdreams' resolved env).
dependencies = [
    "flashdreams",
    "flashdreams-cam2v",
    "flashdreams-wan22",
    "diffusers>=0.34",
    "scipy>=1.11",
]

[tool.uv.sources]
flashdreams = { workspace = true }
flashdreams-cam2v = { workspace = true }
flashdreams-wan22 = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.entry-points."flashdreams.applications_v2"]
"cam2v-hy-worldplay" = "hy_worldplay.apps.cam2v.adapter:create_app"

[tool.setuptools]
packages = [
    "hy_worldplay",
    "hy_worldplay.apps",
    "hy_worldplay.apps.cam2v",
    "hy_worldplay.impl",
]

[tool.setuptools.package-dir]
hy_worldplay = "."
