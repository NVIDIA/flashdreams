[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-hy-worldplay"
version = "0.1.0"
description = "HY-WorldPlay (HY-World 1.5) interactive world model integration for flashdreams (WAN 2.2 5B I2V variant)."
readme = "README.md"
requires-python = ">=3.10"
# The upstream HY-WorldPlay model code (``hyvideo/`` and ``wan/``) lives in
# https://github.com/Tencent-Hunyuan/HY-WorldPlay and is *not* on PyPI.
# The integration provides the FlashDreams-side model, configs, and Action2V
# binding; the upstream tree is provisioned by the parity-check script and,
# for in-tree slugs, must be installed separately into the venv:
#
#     uv pip install --no-build-isolation -e <path-to-HY-WorldPlay>
#
# We therefore deliberately do NOT list HY-WorldPlay as a dependency here
# (its ``requirements.txt`` pulls heavyweight, version-pinned scientific
# stacks that would conflict with flashdreams' resolved env).
dependencies = [
    "flashdreams",
    "flashdreams-action2v-v2",
    "flashdreams-wan22",
    "diffusers>=0.34",
    "imageio[ffmpeg]>=2.31",
    "mediapy>=1.1",
    "moviepy>=1.0,<2",
    "opencv-python-headless",
    "scipy>=1.11",
]

[tool.uv.sources]
flashdreams = { workspace = true }
flashdreams-action2v-v2 = { workspace = true }
flashdreams-wan22 = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

# Heavy upstream-execution deps (sageattention, cloudpickle, accelerate,
# filelock, pyyaml, remote-pdb) are deliberately *not* declared here --
# they would leak into the repo-root ``uv.lock`` and bloat the
# resolved-env for every contributor, including those who never touch
# HY-WorldPlay. The isolated parity-check environment pins them separately;
# this workspace member carries the model implementation and canonical config.
[project.entry-points."flashdreams.applications_v2"]
"action2v-hy-worldplay" = "hy_worldplay.apps.action2v.adapter:create_app"

[tool.setuptools]
packages = [
    "hy_worldplay",
    "hy_worldplay.apps",
    "hy_worldplay.apps.action2v",
    "hy_worldplay.impl",
]

[tool.setuptools.package-dir]
hy_worldplay = "."
