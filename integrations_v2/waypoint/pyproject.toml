[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-waypoint"
version = "0.1.0"
description = "Waypoint 1.5 Cam2V integration for FlashDreams v2."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flashdreams",
    "flashdreams-cam2v",
    "pillow>=10",
]

[tool.uv.sources]
flashdreams = { workspace = true }
flashdreams-cam2v = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.entry-points."flashdreams.applications_v2"]
"cam2v-waypoint" = "waypoint.apps.cam2v.adapter:create_app"

[tool.setuptools]
packages = [
    "waypoint",
    "waypoint.apps",
    "waypoint.apps.cam2v",
    "waypoint.apps.cam2v.assets",
    "waypoint.impl",
    "waypoint.impl.transformer",
]

[tool.setuptools.package-dir]
waypoint = "."

[tool.setuptools.package-data]
"waypoint.apps.cam2v" = ["assets/*.json"]

[tool.uv]
managed = true
