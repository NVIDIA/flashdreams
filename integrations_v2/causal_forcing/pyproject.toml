[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-causal-forcing"
version = "0.1.0"
description = "Causal-Forcing chunkwise / framewise streaming T2V + I2V inference for Wan 2.1 1.3B, packaged as a flashdreams plugin."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flashdreams",
    "mediapy>=1.1",
    "flashdreams-t2v",
    "opencv-python-headless>=4.5",
]

[tool.uv.sources]
flashdreams-t2v = { workspace = true }
flashdreams = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.entry-points."flashdreams.applications_v2"]
"t2v-causal-forcing-wan2.1-t2v-1.3b-chunkwise" = "causal_forcing.apps.t2v.adapter:create_app"
"t2v-causal-forcing-wan2.1-t2v-1.3b-framewise" = "causal_forcing.apps.t2v.adapter:create_app_framewise"

[tool.setuptools]
packages = ["causal_forcing", "causal_forcing.apps", "causal_forcing.apps.t2v", "causal_forcing.impl"]

[tool.setuptools.package-dir]
causal_forcing = "."

[tool.uv]
managed = true
