[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-causal-forcing"
version = "0.1.0"
description = "Causal-Forcing chunkwise / framewise streaming T2V + I2V inference for Wan 2.1 1.3B, packaged as a flashdreams plugin."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flashdreams",
    "flashdreams-t2v",
    "mediapy>=1.1",
    "opencv-python-headless>=4.5",
]

[tool.uv.sources]
flashdreams = { workspace = true }
flashdreams-t2v = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

# Bind the reusable T2V application to this model's root config.
[project.entry-points."flashdreams.applications_v2"]
"t2v-causal-forcing" = "causal_forcing.apps.t2v.adapter:create_app"

[tool.setuptools]
packages = ["causal_forcing", "causal_forcing.apps", "causal_forcing.apps.t2v"]

[tool.setuptools.package-dir]
causal_forcing = "."

[tool.uv]
managed = true
