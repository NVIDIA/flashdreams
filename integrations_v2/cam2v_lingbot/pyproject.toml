[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-cam2v-lingbot"
version = "0.1.0"
description = "Lingbot camera-to-video application for the FlashDreams v2 API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flashdreams",
    "flashdreams-cam2v",
    "flashdreams-flashvsr",
    "flashdreams-lingbot",
]

[tool.uv.sources]
flashdreams = { workspace = true }
flashdreams-cam2v = { workspace = true }
flashdreams-flashvsr = { workspace = true }
flashdreams-lingbot = { workspace = true }

[project.entry-points."flashdreams.applications_v2"]
"cam2v-lingbot" = "cam2v_lingbot.app:create_app"

[tool.setuptools.packages.find]
include = ["cam2v_lingbot*"]

[tool.uv]
managed = true
