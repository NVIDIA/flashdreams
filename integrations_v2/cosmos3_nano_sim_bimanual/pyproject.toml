[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-cosmos3-nano-sim-bimanual"
version = "0.1.0"
description = "Cosmos3 Nano Sim bimanual model pipeline for FlashDreams V2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flashdreams",
    "flashdreams-handdreams",
    "flashdreams-swiftvr",
    "h5py>=3.15.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.entry-points."flashdreams.applications_v2"]
"handdreams" = "cosmos3_nano_sim_bimanual.apps.handdreams.adapter:create_app"
"handdreams-replay" = "cosmos3_nano_sim_bimanual.apps.handdreams.replay:create_app"

[tool.uv.sources]
flashdreams = { workspace = true }
flashdreams-handdreams = { workspace = true }
flashdreams-swiftvr = { workspace = true }

[tool.setuptools]
include-package-data = false
packages = [
    "cosmos3_nano_sim_bimanual",
    "cosmos3_nano_sim_bimanual.apps",
    "cosmos3_nano_sim_bimanual.apps.handdreams",
    "cosmos3_nano_sim_bimanual.decoder",
    "cosmos3_nano_sim_bimanual.encoder",
    "cosmos3_nano_sim_bimanual.transformer",
]

[tool.setuptools.package-dir]
cosmos3_nano_sim_bimanual = "."

[tool.setuptools.package-data]
cosmos3_nano_sim_bimanual = ["normalizers/*.json"]
"cosmos3_nano_sim_bimanual.apps.handdreams" = ["agibot_scenes.json"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -p flashdreams._pytest_plugins.marker_enforcement"
markers = [
    "ci_cpu: CPU-safe test, runs on the CPU CI runner",
    "ci_gpu: requires GPU or libGL (cv2), runs on the GPU CI runner",
    "manual: heavy or environment-specific test, opt-in only",
]

[tool.uv]
managed = true
