[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-self-forcing"
version = "0.1.0"
description = "Self-Forcing distilled streaming T2V inference for Wan 2.1 1.3B, packaged as a flashdreams plugin."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flashdreams",
    "mediapy>=1.1",
    "flashdreams-t2v",
]

[tool.uv.sources]
flashdreams-t2v = { workspace = true }
flashdreams = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.entry-points."flashdreams.applications_v2"]
"t2v-self-forcing-wan2.1-t2v-1.3b" = "self_forcing.apps.t2v.adapter:create_app"
"t2v-self-forcing-wan2.1-t2v-1.3b-taehv" = "self_forcing.apps.t2v.adapter:create_app_taehv"
"t2v-self-forcing-wan2.1-t2v-1.3b-sink5-window7-rerope" = "self_forcing.apps.t2v.adapter:create_app_sink5_window7_rerope"

[tool.setuptools]
packages = ["self_forcing", "self_forcing.apps", "self_forcing.apps.t2v", "self_forcing.impl"]

[tool.setuptools.package-dir]
self_forcing = "."

[tool.uv]
managed = true
