[project]
name = "self-forcing-parity-check"
version = "0.0.0"
description = "Isolated venv for the Self-Forcing parity-check benchmark."
# Match flashdreams' supported Python range exactly (it pins 3.12).
requires-python = ">=3.10"

# flashdreams brings in torch, transformers, einops, ftfy, huggingface-hub,
# numpy, tqdm, safetensors, etc. Self-Forcing only needs a small handful of
# extras layered on top. Transitive deps (accelerate, sentencepiece,
# tokenizers, imageio-ffmpeg, ...) come along via these top-level entries.
dependencies = [
    "flashdreams",
    # The upstream baseline imports torchvision.transforms in wan/modules/clip.py.
    "torchvision>=0.26",
    "diffusers",
    "omegaconf",
    "imageio[ffmpeg]",
    "easydict",
    "lmdb",
    # Stay off the 6.33.x protobuf line flagged by BDSA for the ParseDict
    # recursion-depth follow-up.
    "protobuf>=7.35.0,<8",
]

[tool.uv.sources]
# flashdreams is not on PyPI; install it from the local source tree
# (../../../../flashdreams relative to this directory).
flashdreams = { path = "../../../../flashdreams", editable = true }

[tool.uv]
managed = true
# CVE-2026-59890; PyTorch's <82 cap was unnecessary.
# ponytail: override legacy metadata until all profiles use torch>=2.13.
# https://github.com/pytorch/pytorch/pull/188190
override-dependencies = ["setuptools>=83.0.0,<84"]
build-constraint-dependencies = ["setuptools>=83.0.0,<84"]
# Pillow 12.3 fixes image memory corruption and decompression-bomb bypasses.
constraint-dependencies = ["pillow>=12.3.0"]
