[project]
name = "self-forcing-fastvideo-parity-check"
version = "0.1.0"
description = "Isolated venv for FastVideo Self-Forcing parity benchmark."
requires-python = ">=3.10"
dependencies = [
    "flashdreams",
    "imageio[ffmpeg]",
    "aiofiles",
    "aiohttp",
    "av",
    "cloudpickle",
    "datasets",
    "diffusers",
    "fastapi",
    "flask",
    "flask_restful",
    "gpustat",
    "gradio",
    "h5py",
    "moviepy",
    "omegaconf",
    "opencv-python",
    "pyarrow",
    "protobuf>=7.35.0,<8",
    "ray",
    "remote-pdb",
    "requests",
    "scipy",
    "sentencepiece",
    "test-tube",
    "timm",
    "torchcodec",
    "torchdata",
    "uvicorn",
    "wandb",
    "watch",
]

[tool.uv.sources]
flashdreams = { path = "../../../../flashdreams", editable = true }

[tool.uv]
managed = true
# CVE-2026-59890; PyTorch's <82 cap was unnecessary.
# ponytail: override legacy metadata until all profiles use torch>=2.13.
# https://github.com/pytorch/pytorch/pull/188190
override-dependencies = ["setuptools>=83.0.0,<84"]
build-constraint-dependencies = ["setuptools>=83.0.0,<84"]
# Security floors for HTTP proxy TLS, chunked decoding, and items-view leaks.
constraint-dependencies = ["urllib3>=2.8.0,<3", "multidict>=6.9.1,<7"]
