[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-omnidreams-v2"
version = "0.1.0"
description = "Omnidreams driving application for the FlashDreams v2 API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Integration packages depend on the public framework, never the reverse.
    "flashdreams",
    # The model itself, whose pipeline config this application drives. It owns
    # the module name ``omnidreams``, which is why this one is suffixed.
    "flashdreams-omnidreams",
]

[tool.uv.sources]
# Resolve both from this repository while developing the workspace.
flashdreams = { workspace = true }
flashdreams-omnidreams = { workspace = true }

# What ``flashdreams-run-v2 omnidreams`` resolves to. A separate group from the
# v1 ``flashdreams.runner_configs``, which holds the older contract; the slug is
# the same because it is the same model.
[project.entry-points."flashdreams.applications_v2"]
"omnidreams" = "omnidreams_v2.app:create_app"

[tool.setuptools.packages.find]
# Keep the distribution limited to the integration-owned Python package.
include = ["omnidreams_v2*"]

[tool.uv]
managed = true
