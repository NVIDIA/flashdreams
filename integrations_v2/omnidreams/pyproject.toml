[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-omnidreams"
version = "0.1.0"
description = "OmniDreams inference adapters for native FlashDreams v2 applications"
readme = "README.md"
# PyNvVideoCodec 2.1 currently publishes wheels through CPython 3.12.
requires-python = ">=3.10,<3.13"
dependencies = [
    # Core inference / serving deps consumed by ``omnidreams.impl.grpc`` and
    # the model adapters for the reusable Interactive Drive application.
    "flashdreams[serving]",
    "flashdreams-interactive-drive-v2",
    "crazy-robotaxi",
    "mediapy>=1.1",
    "ludus-renderer",
    "imageio>=2.20",
    "grpcio-tools>=1.50",
    "grpcio>=1.50",
    "nvidia-cudnn-frontend==1.22.1",
    "nvidia-cudnn-cu13==9.23.2.1; sys_platform == 'win32'",
    "opencv-python-headless>=4.5",
    "shapely>=2.0",
    # Runtime deps for the ``interactive_drive`` desktop demo package. Most
    # are already transitive via ``flashdreams[serving]``
    # but listed here explicitly so the subpackage's dep surface is
    # self-describing.
    "numpy>=1.26",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "pyarrow>=16.0",
    "torch>=2.11",
    "torchvision>=0.26",
    "einops>=0.8",
    "safetensors>=0.5",
    "tqdm>=4.67",
    "transformers>=5.0,<6",
    "huggingface_hub>=0.24",
    # NVENC hardware H.264 encoding for the WebRTC path via
    # ``flashdreams.serving.webrtc.encoders.PyNvHardwareEncoder``. Not
    # optional: omnidreams already requires CUDA at runtime, so the
    # PyNvVideoCodec install adds no extra platform surface. Upstream
    # currently publishes wheels for CPython 3.10-3.12 only (including
    # Linux ARM64), so this package's ``requires-python`` excludes 3.13.
    # Hosts without an NVENC ASIC fall back to aiortc's software encoder
    # automatically at session initialization (Stage-1 ``GetEncoderCaps``
    # probe returns unsupported, ``select_encoder`` logs the reason and
    # constructs ``DefaultRTCEncoder``).
    "PyNvVideoCodec>=2.1,<3",
]

[tool.uv.sources]
flashdreams = { workspace = true }
flashdreams-interactive-drive-v2 = { workspace = true }
crazy-robotaxi = { workspace = true }
ludus-renderer = { workspace = true }

[project.optional-dependencies]
# Slangpy runtime, only needed by the ``interactive-drive`` application.
# gRPC server users do not need this and should not pay the presentation
# install cost in their containers. Named after the consumer rather than
# the abstract capability so the install command is self-documenting.
interactive-drive = [
    "slangpy==0.42.0",
]
# Optional NVIDIA VFX runtime for integrations that select RTX postprocessors.
rtx-postprocess = [
    "flashdreams[rtx-postprocess]",
]
dev = [
    "pytest>=8.0",
    "pytest-manual-marker>=2.0",
    # ``interactive_drive`` test-only deps.
    "pyvirtualdisplay>=3.0",
    "flip-evaluator>=1.7",
]

[project.scripts]
# Batch evaluation helper for Hugging Face scene discovery, bounded staging,
# FlashDreams generation, and DrivingGen adapter setup.
omnidreams-eval = "omnidreams.impl.eval.cli:main"
omnidreams-prepare = "omnidreams.impl.tools.prepare:main"

[project.entry-points."flashdreams.applications_v2"]
"interactive-drive-omnidreams" = "omnidreams.apps.interactive_drive.adapter:create_app"
"interactive-drive-omnidreams-perf" = "omnidreams.apps.interactive_drive.adapter:create_perf_app"
"interactive-drive-omnidreams-fast-perf" = "omnidreams.apps.interactive_drive.adapter:create_fast_perf_app"
"crazy-robotaxi-omnidreams" = "omnidreams.apps.crazy_robotaxi.adapter:create_app"
"crazy-robotaxi-omnidreams-perf" = "omnidreams.apps.crazy_robotaxi.adapter:create_perf_app"
"crazy-robotaxi-omnidreams-fast-perf" = "omnidreams.apps.crazy_robotaxi.adapter:create_fast_perf_app"

[tool.setuptools]
packages = [
    "omnidreams",
    "omnidreams.apps",
    "omnidreams.apps.interactive_drive",
    "omnidreams.apps.crazy_robotaxi",
    "omnidreams.impl",
    "omnidreams.impl.conditioning",
    "omnidreams.impl.conditioning.world_scenario",
    "omnidreams.impl.encoder",
    "omnidreams.impl.eval",
    "omnidreams.impl.grpc",
    "omnidreams.impl.grpc.protos",
    "omnidreams.impl.native",
    "omnidreams.impl.scripts",
    "omnidreams.impl.tools",
    "omnidreams.impl.transformer",
]

[tool.setuptools.package-dir]
omnidreams = "."

[tool.uv]
managed = true
