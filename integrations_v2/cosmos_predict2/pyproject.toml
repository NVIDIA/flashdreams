[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-cosmos-predict2"
version = "0.1.0"
description = "Cosmos-Predict2 T2V non-streaming inference plugin for flashdreams."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flashdreams",
    "mediapy>=1.1",
    "flashdreams-t2v",
    # No code here imports this. The Cosmos-Reason1 text encoder these configs
    # select loads through a Qwen2.5-VL processor, which transformers will only
    # build if torchvision is installed. Declared at the version torch>=2.9
    # pairs with, matching the cuda12 and cuda13 groups.
    "torchvision>=0.24",
]

[tool.uv.sources]
flashdreams-t2v = { workspace = true }
flashdreams = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.entry-points."flashdreams.applications_v2"]
"t2v-cosmos2-t2v-2b-720p" = "cosmos_predict2.apps.t2v.adapter:create_app"

[tool.setuptools]
packages = ["cosmos_predict2", "cosmos_predict2.apps", "cosmos_predict2.apps.t2v", "cosmos_predict2.impl"]

[tool.setuptools.package-dir]
cosmos_predict2 = "."

[tool.uv]
managed = true
