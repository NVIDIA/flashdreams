[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-fastvideo-causal-wan22"
version = "0.1.0"
description = "FastVideo CausalWan 2.2 14B MoE distilled streaming T2V inference, packaged as a flashdreams plugin."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flashdreams",
    "mediapy>=1.1",
    "flashdreams-t2v",
]

[tool.uv.sources]
flashdreams-t2v = { workspace = true }
flashdreams = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.entry-points."flashdreams.applications_v2"]
"t2v-fastvideo-causal-wan2.2-t2v-14b" = "fastvideo_causal_wan22.apps.t2v.adapter:create_app"

[tool.setuptools]
packages = [
    "fastvideo_causal_wan22",
    "fastvideo_causal_wan22.apps",
    "fastvideo_causal_wan22.apps.t2v",
    "fastvideo_causal_wan22.impl",
]

[tool.setuptools.package-dir]
fastvideo_causal_wan22 = "."

[tool.uv]
managed = true
