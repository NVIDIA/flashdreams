[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-fastvideo-causal-wan22"
version = "0.1.0"
description = "FastVideo CausalWan 2.2 14B MoE distilled streaming T2V inference, packaged as a flashdreams plugin."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flashdreams",
    "flashdreams-t2v",
    "mediapy>=1.1",
]

[tool.uv.sources]
flashdreams = { workspace = true }
flashdreams-t2v = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

# Bind the reusable T2V application to this model's root config.
[project.entry-points."flashdreams.applications_v2"]
"t2v-fastvideo-causal-wan22" = "fastvideo_causal_wan22.apps.t2v.adapter:create_app"

[tool.setuptools]
packages = [
    "fastvideo_causal_wan22",
    "fastvideo_causal_wan22.apps",
    "fastvideo_causal_wan22.apps.t2v",
]

[tool.setuptools.package-dir]
fastvideo_causal_wan22 = "."

[tool.uv]
managed = true
