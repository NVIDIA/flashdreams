[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-sana-wm"
version = "0.1.0"
description = "SANA-WM world-model and Cam2V integration for FlashDreams v2."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "diffusers>=0.36",
    "flashdreams",
    "flashdreams-cam2v",
    "Pillow>=12.3.0",
    "PyYAML>=6.0",
    "safetensors>=0.5",
    "sentencepiece>=0.2",
    "torchvision>=0.26",
    "transformers[sentencepiece]>=5.17,<6",
]

[tool.uv.sources]
flashdreams = { workspace = true }
flashdreams-cam2v = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.entry-points."flashdreams.applications_v2"]
"cam2v-sana-wm-streaming" = "sana_wm.apps.cam2v.adapter:create_app"

[tool.setuptools]
packages = [
    "sana_wm",
    "sana_wm.apps",
    "sana_wm.apps.cam2v",
    "sana_wm.impl",
    "sana_wm.impl.ops",
]

[tool.setuptools.package-dir]
sana_wm = "."

[tool.uv]
managed = true
