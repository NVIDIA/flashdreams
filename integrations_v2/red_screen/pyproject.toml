[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-red-screen"
version = "0.1.0"
description = "Key-driven red screen application for end-to-end FlashDreams v2 API testing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Integration packages depend on the public framework, never the reverse.
    "flashdreams[serving]",
]

[project.scripts]
red-screen-webrtc = "red_screen.app:main"

[tool.uv.sources]
# Resolve the framework from this repository while developing the workspace.
# A published integration would resolve its released FlashDreams dependency.
flashdreams = { workspace = true }

[tool.setuptools.packages.find]
# Keep the distribution limited to the integration-owned Python package.
include = ["red_screen*"]

[tool.uv]
managed = true
