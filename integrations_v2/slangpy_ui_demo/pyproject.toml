[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-slangpy-ui-demo"
version = "0.1.0"
description = "SlangPy UI demos for the FlashDreams v2 loop runtime."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flashdreams[local-window,serving]",
]

[project.entry-points."flashdreams.applications_v2"]
"slangpy-ui-text-input" = "slangpy_ui_demo.text_input_app:create_app"
"slangpy-ui-model-output" = "slangpy_ui_demo.model_output_app:create_app"
"slangpy-ui-invoke-async" = "slangpy_ui_demo.invoke_async_app:create_app"

[tool.uv.sources]
flashdreams = { workspace = true }

[tool.setuptools.packages.find]
include = ["slangpy_ui_demo*"]

[tool.uv]
managed = true
