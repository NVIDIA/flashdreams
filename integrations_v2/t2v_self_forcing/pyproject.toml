[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-t2v-self-forcing"
version = "0.1.0"
description = "Self-Forcing text-to-video application for the FlashDreams v2 API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Integration packages depend on the public framework, never the reverse.
    "flashdreams",
    # The model itself, whose pipeline config this application drives.
    "flashdreams-self-forcing",
]

[tool.uv.sources]
# Resolve both from this repository while developing the workspace.
flashdreams = { workspace = true }
flashdreams-self-forcing = { workspace = true }

# What ``flashdreams-run-v2 t2v-self-forcing`` resolves to. A separate group from
# the v1 ``flashdreams.applications``, which holds the older contract; the slug
# is the same because it is the same model.
[project.entry-points."flashdreams.applications_v2"]
"t2v-self-forcing" = "t2v_self_forcing.app:create_app"

[tool.setuptools.packages.find]
# Keep the distribution limited to the integration-owned Python package.
include = ["t2v_self_forcing*"]

[tool.uv]
managed = true
