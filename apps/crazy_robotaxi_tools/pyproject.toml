[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crazy-robotaxi-tools"
version = "0.2.0"
description = "Offline map authoring tools for Crazy Robotaxi"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["crazy-robotaxi", "omnidreams-game-engine-tools"]

[project.scripts]
crazy-robotaxi-map = "crazy_robotaxi_tools.map_tool:main"

[tool.uv.sources]
crazy-robotaxi = { workspace = true }
omnidreams-game-engine-tools = { workspace = true }

[tool.setuptools.packages.find]
include = ["crazy_robotaxi_tools*"]
