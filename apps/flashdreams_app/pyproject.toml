[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-app"
version = "0.1.0"
description = "Generic host for FlashDreams application runtimes"
requires-python = ">=3.10"
dependencies = ["flashdreams[serving]"]

[project.scripts]
flashdreams-app = "flashdreams_app.cli:main"

[tool.uv.sources]
flashdreams = { workspace = true }

[tool.setuptools.packages.find]
where = ["."]
