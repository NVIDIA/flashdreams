schema_version: 1
id: crazy-robotaxi-minimal-loop
name: Minimal Loop and Parking Lot

compiler:
  sample_spacing_m: 2.0
  ground_margin_m: 20.0
  intersection_connector_samples: 8

profiles:
  neighborhood:
    lane_width_m: 3.6
    curb_offset_m: 0.6
    lanes: [backward, forward]
    speed_limit_mps: 13.4
    curb: true
    lane_marking: {style: SOLID_GROUP, color: YELLOW}
    divider_markings:
      - {style: SOLID_GROUP, color: YELLOW}
nodes:
  - id: hub
    type: intersection
    pose: {x_m: 0, y_m: 0, rotation_deg: 0}
    curb: true

  - id: dead_end
    type: cul_de_sac
    pose: {x_m: 0, y_m: 30, rotation_deg: 0}
    culdesac_radius_m: 10
    curb: true

  - id: neighborhood_lot
    type: parking_lot
    vertices:
      - {x_m: -13, y_m: -51}
      - {x_m: -13, y_m: -19}
      - {x_m: -3.6, y_m: -19}
      - {x_m: 3.6, y_m: -19}
      - {x_m: 13, y_m: -19}
      - {x_m: 13, y_m: -51}

roads:
  - id: neighborhood_loop
    from: hub
    to: hub
    profile: neighborhood
    path:
      - {x_m: 45, y_m: 15}
      - {x_m: 45, y_m: 50}
      - {x_m: -45, y_m: 50}
      - {x_m: -45, y_m: 15}

  - id: dead_end_road
    from: hub
    to: dead_end
    profile: neighborhood

parking_accesses:
  - {id: hub_to_lot, source: hub, parking_lot: neighborhood_lot, opening_vertex: 3}

spawns:
  - id: taxi_start
    road: neighborhood_loop
    lane: 1
    distance_m: 5
    variants:
      default:
        image: package://omnidreams_game_engine/screenshot.jpg
        prompt: >-
          A forward-facing view from a taxi moving through a quiet suburban
          neighborhood in daylight, with houses, low commercial buildings,
          landscaping, and parked cars.
