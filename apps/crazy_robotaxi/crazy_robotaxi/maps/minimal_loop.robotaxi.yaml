schema_version: 1
id: crazy-robotaxi-minimal-loop
name: Minimal Loop and Parking Lot

compiler:
  sample_spacing_m: 2.0
  ground_margin_m: 20.0
  intersection_connector_samples: 8
  parking_lot:
    turnaround_width_multiplier: 0.75
    turnaround_min_depth_m: 5.0
    turnaround_control_inset_m: 0.75

profiles:
  neighborhood:
    lane_width_m: 3.6
    curb_offset_m: 0.6
    lanes: [backward, forward]
    speed_limit_mps: 13.4
    curb: true
    lane_marking: {style: SOLID_GROUP, color: YELLOW}
    divider_markings:
      - {style: SOLID_GROUP, color: YELLOW}
  parking_access:
    lane_width_m: 3.2
    curb_offset_m: 0.4
    lanes: [backward, forward]
    speed_limit_mps: 5.5
    curb: true
    lane_marking: {style: VIRTUAL, color: WHITE}
    divider_markings:
      - {style: VIRTUAL, color: WHITE}

nodes:
  - id: hub
    type: intersection
    pose: {x_m: 0, y_m: 0, rotation_deg: 0}
    geometry: {}

  - id: dead_end
    type: cul_de_sac
    pose: {x_m: 0, y_m: 30, rotation_deg: 0}
    geometry: {radius_m: 10}

  - id: lot_driveway
    type: driveway
    profile: parking_access
    pose: {x_m: 0, y_m: -10, rotation_deg: 0}
    geometry: {width_m: 6.4}

  - id: neighborhood_lot
    type: parking_lot
    profile: parking_access
    pose: {x_m: 0, y_m: -35, rotation_deg: 0}
    geometry: {width_m: 26, depth_m: 32}

roads:
  - id: neighborhood_loop
    from: hub
    to: hub
    profile: neighborhood
    path:
      - control_points: [{x_m: 30, y_m: 0}, {x_m: 45, y_m: 0}]
        end: {x_m: 45, y_m: 15}
      - control_points: [{x_m: 45, y_m: 35}, {x_m: 45, y_m: 50}]
        end: {x_m: 30, y_m: 50}
      - control_points: [{x_m: -30, y_m: 50}, {x_m: -45, y_m: 35}]
        end: {x_m: -45, y_m: 15}
      - control_points: [{x_m: -45, y_m: 0}, {x_m: -30, y_m: 0}]
        end: {x_m: 0, y_m: 0}

  - id: dead_end_road
    from: hub
    to: dead_end
    profile: neighborhood

links:
  - {id: hub_to_lot_driveway, a: hub, b: lot_driveway}
  - {id: lot_driveway_to_lot, a: lot_driveway, b: neighborhood_lot}

road_attachments: []

spawns:
  - id: taxi_start
    road: neighborhood_loop
    lane: 1
    distance_m: 5
    variants:
      default:
        image: package://omnidreams_game_engine/screenshot.jpg
        prompt: >-
          A forward-facing view from a taxi moving through a quiet suburban
          neighborhood in daylight, with houses, low commercial buildings,
          landscaping, and parked cars.
