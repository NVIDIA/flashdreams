schema_version: 1
id: crazy-robotaxi-grand-prix-demo
name: Demo Grand Prix

compiler:
  sample_spacing_m: 2.0
  ground_margin_m: 30.0
  intersection_connector_samples: 8

profiles:
  raceway:
    lane_width_m: 5.5
    curb_offset_m: 1.5
    lanes: [backward, backward, forward, forward]
    speed_limit_mps: 24.0
    lane_marking: {style: DASHED_SINGLE, color: WHITE}
    divider_markings:
      - {style: DASHED_SINGLE, color: WHITE}
      - {style: DASHED_SINGLE, color: WHITE}
      - {style: DASHED_SINGLE, color: WHITE}

nodes:
  - {id: start_finish, type: road_joint, pose: {x_m: 0, y_m: -150}}
  - {id: southeast_entry, type: road_joint, pose: {x_m: 160, y_m: -150}}
  - {id: southeast_exit, type: road_joint, pose: {x_m: 250, y_m: -60}}
  - {id: northeast_entry, type: road_joint, pose: {x_m: 250, y_m: 70}}
  - {id: northeast_exit, type: road_joint, pose: {x_m: 160, y_m: 160}}
  - {id: chicane_entry, type: road_joint, pose: {x_m: 80, y_m: 160}}
  - {id: chicane_exit, type: road_joint, pose: {x_m: -70, y_m: 150}}
  - {id: northwest_entry, type: road_joint, pose: {x_m: -160, y_m: 150}}
  - {id: northwest_exit, type: road_joint, pose: {x_m: -250, y_m: 60}}
  - {id: southwest_entry, type: road_joint, pose: {x_m: -250, y_m: -60}}
  - {id: southwest_exit, type: road_joint, pose: {x_m: -160, y_m: -150}}

roads:
  - id: start_finish_straight
    from: southwest_exit
    to: start_finish
    profile: raceway

  - id: south_straight
    from: start_finish
    to: southeast_entry
    profile: raceway

  - id: southeast_curve
    from: southeast_entry
    to: southeast_exit
    profile: raceway
    bezier:
      - control_points:
          - {x_m: 209.706, y_m: -150}
          - {x_m: 250, y_m: -109.706}
        end: {x_m: 250, y_m: -60}

  - id: east_straight
    from: southeast_exit
    to: northeast_entry
    profile: raceway

  - id: northeast_curve
    from: northeast_entry
    to: northeast_exit
    profile: raceway
    bezier:
      - control_points:
          - {x_m: 250, y_m: 119.706}
          - {x_m: 209.706, y_m: 160}
        end: {x_m: 160, y_m: 160}

  - id: upper_straight
    from: northeast_exit
    to: chicane_entry
    profile: raceway

  - id: upper_chicane
    from: chicane_entry
    to: chicane_exit
    profile: raceway
    bezier:
      - control_points:
          - {x_m: 50, y_m: 160}
          - {x_m: 40, y_m: 115}
        end: {x_m: 10, y_m: 115}
      - control_points:
          - {x_m: -20, y_m: 115}
          - {x_m: -35, y_m: 150}
        end: {x_m: -70, y_m: 150}

  - id: northwest_straight
    from: chicane_exit
    to: northwest_entry
    profile: raceway

  - id: northwest_curve
    from: northwest_entry
    to: northwest_exit
    profile: raceway
    bezier:
      - control_points:
          - {x_m: -209.706, y_m: 150}
          - {x_m: -250, y_m: 109.706}
        end: {x_m: -250, y_m: 60}

  - id: west_straight
    from: northwest_exit
    to: southwest_entry
    profile: raceway

  - id: southwest_curve
    from: southwest_entry
    to: southwest_exit
    profile: raceway
    bezier:
      - control_points:
          - {x_m: -250, y_m: -109.706}
          - {x_m: -209.706, y_m: -150}
        end: {x_m: -160, y_m: -150}

race_courses:
  - id: grand-prix
    start: start_finish
    checkpoints:
      - southeast_curve
      - east_straight
      - northeast_curve
      - upper_straight
      - upper_chicane
      - northwest_straight
      - northwest_curve
      - west_straight
      - southwest_curve
      - start_finish_straight
    lap_count: 1
    checkpoint_markers: true

spawns:
  - id: race_start
    road: start_finish_straight
    lane: 2
    distance_m: 90
    variants:
      default:
        image: package://omnidreams_game_engine/screenshot.jpg
        prompt: >-
          A forward-facing view from a taxi on a wide closed urban Grand Prix
          circuit in daylight, with sweeping corners, a technical chicane,
          safety barriers, grandstands, sponsor banners, and a clear
          start-finish straight.
