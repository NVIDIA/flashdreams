race_courses:
  - id: eastbound-boulevard-sprint
    start: spawn_arterial
    checkpoints:
      - central_arterial_crossing
      - diagonal_arterial_crossing
      - arterial_merge_crossing
      - arterial_crossing_550
      - arterial_crossing_710
      - arterial_crossing_895
      - arterial_crossing_1082
      - east_arterial_end
    lap_count: 0
    checkpoint_markers: true

traffic_count: 100

traffic:
  - id: arterial_eastbound
    nodes: [west_arterial_crossing, arterial_crossing_1170]
    end_behavior: reverse
  - id: arterial_westbound
    nodes: [arterial_crossing_1170, west_arterial_crossing]
    end_behavior: reverse

  - id: northwest_clockwise
    nodes: [west_arterial_crossing, west_north_crossing, west_upper_crossing, central_upper_crossing, central_north_crossing, central_arterial_crossing]
    end_behavior: wrap
  - id: northwest_counterclockwise
    nodes: [central_upper_crossing, west_upper_crossing, west_north_crossing, west_arterial_crossing, central_arterial_crossing, central_north_crossing]
    end_behavior: wrap

  - id: diagonal_clockwise
    nodes: [diagonal_arterial_crossing, diagonal_north_crossing, north_crossing_470, arterial_crossing_470, arterial_merge_crossing]
    end_behavior: wrap
  - id: diagonal_counterclockwise
    nodes: [north_crossing_470, diagonal_north_crossing, diagonal_arterial_crossing, arterial_merge_crossing, arterial_crossing_470]
    end_behavior: wrap

  - id: southwest_clockwise
