schema_version: 1
id: crazy-robotaxi-boulevard-district
name: Original Boulevard District (WIP)

compiler:
  sample_spacing_m: 2.0
  ground_margin_m: 20.0
  intersection_connector_samples: 8
  parking_lot:
    turnaround_width_multiplier: 0.75
    turnaround_min_depth_m: 5.0
    turnaround_control_inset_m: 0.75

profiles:
  boulevard:
    lane_width_m: 3.6
    curb_offset_m: 0.6
    lanes: [backward, backward, forward, forward]
    speed_limit_mps: 15.6
    curb: true
    lane_marking: {style: DASHED_SINGLE, color: WHITE}
    divider_markings:
      - {style: DASHED_SINGLE, color: WHITE}
      - {style: SOLID_GROUP, color: YELLOW}
      - {style: DASHED_SINGLE, color: WHITE}
  neighborhood:
    lane_width_m: 3.6
    curb_offset_m: 0.6
    lanes: [backward, forward]
    speed_limit_mps: 11.2
    curb: true
    lane_marking: {style: SOLID_GROUP, color: YELLOW}
    divider_markings:
      - {style: SOLID_GROUP, color: YELLOW}
  parking_access:
    lane_width_m: 3.2
    curb_offset_m: 0.4
    lanes: [backward, forward]
    speed_limit_mps: 5.5
    curb: true
    lane_marking: {style: VIRTUAL, color: WHITE}
    divider_markings:
      - {style: VIRTUAL, color: WHITE}

elements:
  - id: west_boulevard
    type: boulevard
    profile: boulevard
    geometry: {kind: straight, length_m: 80}
    pose: {x_m: -120, y_m: 0, heading_deg: 0}

  - id: central_crossing
    type: intersection
    profile: boulevard
    geometry:
      kind: four_way
      port_profiles: {north: neighborhood, south: neighborhood}
    attach: {port: west, to: west_boulevard.end}

  - id: central_boulevard
    type: boulevard
    profile: boulevard
    geometry: {kind: straight, length_m: 75}
    attach: {port: start, to: central_crossing.east}

  - id: east_crossing
    type: intersection
    profile: boulevard
    geometry:
      kind: four_way
      port_profiles: {north: neighborhood, south: neighborhood}
    attach: {port: west, to: central_boulevard.end}

  - id: east_boulevard
    type: boulevard
    profile: boulevard
    geometry: {kind: straight, length_m: 80}
    attach: {port: start, to: east_crossing.east}

  - id: central_north_street
    type: road_segment
    profile: neighborhood
    geometry: {kind: straight, length_m: 45}
    attach: {port: start, to: central_crossing.north}

  - id: east_north_street
    type: road_segment
    profile: neighborhood
    geometry: {kind: straight, length_m: 45}
    attach: {port: start, to: east_crossing.north}

  - id: central_north_junction
    type: intersection
    profile: neighborhood
    geometry:
      kind: four_way
      port_profiles: {}
    attach: {port: south, to: central_north_street.end}

  - id: north_cross_street
    type: road_segment
    profile: neighborhood
    geometry: {kind: straight, length_m: 75}
    attach: {port: start, to: central_north_junction.east}

  - id: east_north_junction
    type: intersection
    profile: neighborhood
    geometry:
      kind: four_way
      port_profiles: {}
    attach: {port: west, to: north_cross_street.end}

  - id: central_south_street
    type: road_segment
    profile: neighborhood
    geometry: {kind: straight, length_m: 39.2}
    attach: {port: start, to: central_crossing.south}

  - id: central_south_junction
    type: intersection
    profile: neighborhood
    geometry:
      kind: t
      port_profiles: {}
    attach: {port: west, to: central_south_street.end}

  - id: central_south_tail
    type: road_segment
    profile: neighborhood
    geometry: {kind: straight, length_m: 30}
    attach: {port: start, to: central_south_junction.east}

  - id: south_cross_street
    type: road_segment
    profile: neighborhood
    geometry: {kind: straight, length_m: 75}
    attach: {port: start, to: central_south_junction.north}

  - id: east_south_street
    type: road_segment
    profile: neighborhood
    geometry: {kind: straight, length_m: 39.2}
    attach: {port: start, to: east_crossing.south}

  - id: east_south_junction
    type: intersection
    profile: neighborhood
    geometry:
      kind: four_way
      port_profiles: {}
    attach: {port: north, to: east_south_street.end}

  - id: east_south_spur
    type: road_segment
    profile: neighborhood
    geometry: {kind: straight, length_m: 15.8}
    attach: {port: start, to: east_south_junction.east}

  - id: east_lot_junction
    type: intersection
    profile: neighborhood
    geometry:
      kind: t
      port_profiles: {}
    attach: {port: west, to: east_south_spur.end}

  - id: east_south_spur_tail
    type: road_segment
    profile: neighborhood
    geometry: {kind: straight, length_m: 15.8}
    attach: {port: start, to: east_lot_junction.east}

  - id: east_south_tail
    type: road_segment
    profile: neighborhood
    geometry: {kind: straight, length_m: 30}
    attach: {port: start, to: east_south_junction.south}

  - id: central_lower_junction
    type: intersection
    profile: neighborhood
    geometry:
      kind: t
      port_profiles: {}
    attach: {port: north, to: central_south_tail.end}

  - id: lower_cross_west
    type: road_segment
    profile: neighborhood
    geometry: {kind: straight, length_m: 33.3}
    attach: {port: start, to: central_lower_junction.east}

  - id: lower_lot_junction
    type: intersection
    profile: neighborhood
    geometry:
      kind: t
      port_profiles: {}
    attach: {port: east, to: lower_cross_west.end}

  - id: lower_cross_east
    type: road_segment
    profile: neighborhood
    geometry: {kind: straight, length_m: 33.3}
    attach: {port: start, to: lower_lot_junction.west}

  - id: east_lower_junction
    type: intersection
    profile: neighborhood
    geometry:
      kind: t
      port_profiles: {}
    attach: {port: west, to: lower_cross_east.end}

  - id: central_lot_opening
    type: parking_lot_opening
    profile: parking_access
    geometry: {length_m: 5, road_profile: neighborhood}
    attach: {port: road, to: lower_lot_junction.north}

  - id: central_lot_driveway
    type: driveway
    profile: parking_access
    geometry: {kind: straight, length_m: 8}
    attach: {port: start, to: central_lot_opening.access}

  - id: central_parking_lot
    type: parking_lot
    profile: parking_access
    geometry: {width_m: 26, depth_m: 32}
    attach: {port: entrance, to: central_lot_driveway.end}

  - id: east_lot_opening
    type: parking_lot_opening
    profile: parking_access
    geometry: {length_m: 5, road_profile: neighborhood}
    attach: {port: road, to: east_lot_junction.north}

  - id: east_lot_driveway
    type: driveway
    profile: parking_access
    geometry: {kind: straight, length_m: 8}
    attach: {port: start, to: east_lot_opening.access}

  - id: east_parking_lot
    type: parking_lot
    profile: parking_access
    geometry: {width_m: 24, depth_m: 24}
    attach: {port: entrance, to: east_lot_driveway.end}

  - id: eastern_gateway
    type: intersection
    profile: boulevard
    geometry:
      kind: freeform
      surface:
        - {x_m: 0, y_m: -14}
        - {x_m: 14, y_m: -14}
        - {x_m: 30, y_m: -4}
        - {x_m: 30, y_m: 8}
        - {x_m: 18, y_m: 14}
        - {x_m: 0, y_m: 14}
      connector_center: {x_m: 12, y_m: 0}
      ports:
        west: {x_m: 0, y_m: 0, heading_deg: 180, profile: boulevard}
        north: {x_m: 9, y_m: 14, heading_deg: 90, profile: neighborhood}
        south: {x_m: 7, y_m: -14, heading_deg: 270, profile: neighborhood}
        southeast:
          {x_m: 22, y_m: -9, heading_deg: -57.994617, profile: boulevard}
    attach: {port: west, to: east_boulevard.end}

  - id: eastern_north_approach
    type: road_segment
    profile: neighborhood
    geometry: {kind: straight, length_m: 52}
    attach: {port: start, to: eastern_gateway.north}

  - id: eastern_north_junction
    type: intersection
    profile: neighborhood
    geometry:
      kind: freeform
      surface:
        - {x_m: -6, y_m: 0}
        - {x_m: 6, y_m: 0}
        - {x_m: 10, y_m: 5}
        - {x_m: 10, y_m: 14}
        - {x_m: 8, y_m: 18}
        - {x_m: -4, y_m: 18}
        - {x_m: -6, y_m: 14}
      connector_center: {x_m: 1, y_m: 9}
      ports:
        south: {x_m: 0, y_m: 0, heading_deg: 270, profile: neighborhood}
        north: {x_m: 2, y_m: 18, heading_deg: 90, profile: neighborhood}
        east: {x_m: 10, y_m: 9.5, heading_deg: 0, profile: neighborhood}
    attach: {port: south, to: eastern_north_approach.end}

  - id: eastern_north_continuation
    type: road_segment
    profile: neighborhood
    geometry: {kind: straight, length_m: 32}
    attach: {port: start, to: eastern_north_junction.north}

  - id: eastern_side_road
    type: road_segment
    profile: neighborhood
    geometry: {kind: straight, length_m: 18}
    attach: {port: start, to: eastern_north_junction.east}

  - id: eastern_lot_junction
    type: intersection
    profile: neighborhood
    geometry:
      kind: t
      port_profiles: {}
    attach: {port: west, to: eastern_side_road.end}

  - id: eastern_side_tail
    type: road_segment
    profile: neighborhood
    geometry: {kind: straight, length_m: 20}
    attach: {port: start, to: eastern_lot_junction.east}

  - id: eastern_lot_opening
    type: parking_lot_opening
    profile: parking_access
    geometry: {length_m: 5, road_profile: neighborhood}
    attach: {port: road, to: eastern_lot_junction.north}

  - id: eastern_lot_driveway
    type: driveway
    profile: parking_access
    geometry: {kind: straight, length_m: 8}
    attach: {port: start, to: eastern_lot_opening.access}

  - id: eastern_parking_lot
    type: parking_lot
    profile: parking_access
    geometry: {width_m: 24, depth_m: 24}
    attach: {port: entrance, to: eastern_lot_driveway.end}

  - id: eastern_south_approach
    type: road_segment
    profile: neighborhood
    geometry: {kind: straight, length_m: 70}
    attach: {port: start, to: eastern_gateway.south}

  - id: eastern_south_junction
    type: intersection
    profile: neighborhood
    geometry:
      kind: freeform
      surface:
        - {x_m: -8, y_m: -20}
        - {x_m: 20, y_m: -20}
        - {x_m: 25, y_m: -15}
        - {x_m: 9, y_m: -5}
        - {x_m: 8, y_m: 0}
        - {x_m: -8, y_m: 0}
      connector_center: {x_m: 2, y_m: -9}
      ports:
        north: {x_m: 0, y_m: 0, heading_deg: 90, profile: neighborhood}
        sweep:
          {x_m: 17, y_m: -10, heading_deg: 57.994617, profile: boulevard}
        southwest: {x_m: 6, y_m: -20, heading_deg: 270, profile: boulevard}
    attach: {port: north, to: eastern_south_approach.end}

  - id: eastern_sweep
    type: boulevard
    profile: boulevard
    geometry:
      kind: cubic_bezier
      control_points:
        - {x_m: 30, y_m: 0}
        - {x_m: 62.184798, y_m: -20.882003}
        - {x_m: 73.139854, y_m: -43.353913}
    attach: {port: start, to: eastern_gateway.southeast}

  - id: eastern_southwest_continuation
    type: boulevard
    profile: boulevard
    geometry:
      kind: cubic_bezier
      control_points:
        - {x_m: 20, y_m: 0}
        - {x_m: 40, y_m: -10}
        - {x_m: 60, y_m: -25}
    attach: {port: start, to: eastern_south_junction.southwest}

connections:
  - {a: east_north_junction.south, b: east_north_street.end}
  - {a: south_cross_street.end, b: east_south_junction.west}
  - {a: east_lower_junction.north, b: east_south_tail.end}
  - {a: eastern_sweep.end, b: eastern_south_junction.sweep}

spawns:
  - id: original_area_start
    element: central_boulevard
    lane: 2
    distance_m: 30
    variants:
      default:
        image: package://omnidreams_game_engine/screenshot.jpg
        prompt: >-
          A forward-facing view from a taxi moving through a quiet suburban
          district in daylight, with low commercial buildings, houses,
          landscaping, and parked cars.
