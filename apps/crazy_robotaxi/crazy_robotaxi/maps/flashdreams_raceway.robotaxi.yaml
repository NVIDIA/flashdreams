schema_version: 1
id: crazy-robotaxi-grand-prix-demo
name: FlashDreams Raceway

compiler:
  sample_spacing_m: 1.5
  ground_margin_m: 30.0
  intersection_connector_samples: 8

profiles:
  raceway:
    lane_width_m: 5.5
    curb_offset_m: 1.5
    lanes: [backward, backward, forward, forward]
    speed_limit_mps: 24.0
    lane_marking: {style: DASHED_SINGLE, color: WHITE}
    divider_markings:
      - {style: DASHED_SINGLE, color: WHITE}
      - {style: DASHED_SINGLE, color: WHITE}
      - {style: DASHED_SINGLE, color: WHITE}

nodes:
  - {id: start_finish, type: road_joint, pose: {x_m: 0, y_m: -160}}
  - {id: turn_one_entry, type: road_joint, pose: {x_m: 210, y_m: -160}}
  - {id: east_short_entry, type: road_joint, pose: {x_m: 290, y_m: -90}}
  - {id: infield_turn_entry, type: road_joint, pose: {x_m: 290, y_m: -50}}
  - {id: infield_straight_entry, type: road_joint, pose: {x_m: 230, y_m: 20}}
  - {id: hairpin_entry, type: road_joint, pose: {x_m: 90, y_m: 20}}
  - {id: hairpin_exit, type: road_joint, pose: {x_m: 100, y_m: 140}}
  - {id: north_sweeper_entry, type: road_joint, pose: {x_m: 220, y_m: 140}}
  - {id: top_straight_entry, type: road_joint, pose: {x_m: 150, y_m: 250}}
  - {id: esses_entry, type: road_joint, pose: {x_m: -60, y_m: 250}}
  - {id: esses_exit, type: road_joint, pose: {x_m: -160, y_m: 50}}
  - {id: west_hairpin_entry, type: road_joint, pose: {x_m: -270, y_m: 50}}
  - {id: west_hairpin_exit, type: road_joint, pose: {x_m: -270, y_m: -160}}

roads:
  - id: start_finish_straight
    from: west_hairpin_exit
    to: start_finish
    profile: raceway
    prompt_context: >-
      The start-finish straight runs past packed grandstands, pit garages,
      timing towers, sponsor gantries, and a black-and-white checkered line.

  - id: main_straight
    from: start_finish
    to: turn_one_entry
    profile: raceway
    prompt_context: >-
      A broad city-center racing straight is enclosed by concrete barriers,
      tall safety fencing, colorful sponsor banners, and glass office towers.

  - id: turn_one
    from: turn_one_entry
    to: east_short_entry
    profile: raceway
    prompt_context: >-
      The circuit sweeps around a monumental civic plaza with stone steps,
      fountains, flagpoles, dense crowds, and a skyline of modern towers.
    bezier:
      - control_points:
          - {x_m: 255, y_m: -160}
          - {x_m: 290, y_m: -125}
        end: {x_m: 290, y_m: -90}

  - id: east_short
    from: east_short_entry
    to: infield_turn_entry
    profile: raceway
    prompt_context: >-
      The race course passes a colorful entertainment district of neon signs,
      theater marquees, rooftop billboards, and spectator balconies.

  - id: infield_turn
    from: infield_turn_entry
    to: infield_straight_entry
    profile: raceway
    prompt_context: >-
      A technical bend threads through a landscaped city park with mature
      trees, flower beds, sculptures, and spectators behind safety fencing.
    bezier:
      - control_points:
          - {x_m: 290, y_m: -15}
          - {x_m: 265, y_m: 20}
        end: {x_m: 230, y_m: 20}

  - id: infield_straight
    from: infield_straight_entry
    to: hairpin_entry
    profile: raceway
    prompt_context: >-
      The infield straight follows a canal lined with brick warehouses,
      iron footbridges, waterside cafes, race barriers, and fluttering flags.

  - id: infield_hairpin
    from: hairpin_entry
    to: hairpin_exit
    profile: raceway
    prompt_context: >-
      The tight hairpin circles a lively market square filled with striped
      awnings, old masonry facades, cafe terraces, and cheering race fans.
    bezier:
      - control_points:
          - {x_m: 40, y_m: 20}
          - {x_m: 20, y_m: 45}
        end: {x_m: 20, y_m: 75}
      - control_points:
          - {x_m: 20, y_m: 110}
          - {x_m: 55, y_m: 140}
        end: {x_m: 100, y_m: 140}

  - id: back_straight
    from: hairpin_exit
    to: north_sweeper_entry
    profile: raceway
    prompt_context: >-
      A fast tree-lined boulevard runs beside red-brick row houses, pocket
      parks, pedestrian bridges, and long walls of racing advertisements.

  - id: north_sweeper
    from: north_sweeper_entry
    to: top_straight_entry
    profile: raceway
    prompt_context: >-
      The broad sweeper curves along a sunny waterfront with a marina,
      sailboats, palms, promenade crowds, and the city skyline across the bay.
    bezier:
      - control_points:
          - {x_m: 290, y_m: 140}
          - {x_m: 300, y_m: 250}
        end: {x_m: 150, y_m: 250}

  - id: top_straight
    from: top_straight_entry
    to: esses_entry
    profile: raceway
    prompt_context: >-
      The circuit charges through a museum district of bold contemporary
      architecture, public art, reflecting pools, and elevated walkways.

  - id: technical_esses
    from: esses_entry
    to: esses_exit
    profile: raceway
    prompt_context: >-
      Rapid esses weave through a lush botanical garden with dense greenery,
      glass conservatories, rocky landscaping, and close safety barriers.
    bezier:
      - control_points:
          - {x_m: -105, y_m: 250}
          - {x_m: -155, y_m: 225}
        end: {x_m: -155, y_m: 185}
      - control_points:
          - {x_m: -155, y_m: 145}
          - {x_m: -90, y_m: 145}
        end: {x_m: -80, y_m: 110}
      - control_points:
          - {x_m: -70, y_m: 75}
          - {x_m: -120, y_m: 50}
        end: {x_m: -160, y_m: 50}

  - id: west_straight
    from: esses_exit
    to: west_hairpin_entry
    profile: raceway
    prompt_context: >-
      The west straight crosses a gritty arts district of converted factories,
      vivid murals, steel fire escapes, food trucks, and overhead rail lines.

  - id: west_hairpin
    from: west_hairpin_entry
    to: west_hairpin_exit
    profile: raceway
    prompt_context: >-
      The final hairpin wraps around a busy harbor quarter with cargo cranes,
      stacked containers, dockside warehouses, and grandstands above the quay.
    bezier:
      - control_points:
          - {x_m: -330, y_m: 50}
          - {x_m: -365, y_m: 5}
        end: {x_m: -365, y_m: -55}
      - control_points:
          - {x_m: -365, y_m: -115}
          - {x_m: -330, y_m: -160}
        end: {x_m: -270, y_m: -160}

race_courses:
  - id: grand-prix
    spawn: race_start
    start: start_finish
    checkpoints:
      - turn_one
      - east_short
      - infield_turn
      - infield_straight
      - infield_hairpin
      - back_straight
      - north_sweeper
      - top_straight
      - technical_esses
      - west_straight
      - west_hairpin
      - start_finish_straight
    lap_count: 1
    checkpoint_markers: true

spawns:
  - id: race_start
    road: start_finish_straight
    lane: 2
    distance_m: 220
    image: package://omnidreams_game_engine/screenshot.jpg
    prompt: >-
      A forward-facing view from a taxi on a wide closed Formula-style
      road circuit in daylight, with varied-radius corners, technical
      esses, hairpins, safety barriers, grandstands, sponsor banners,
      and a clear start-finish straight.
    prompt_context: >-
      A forward-facing view from a taxi on a wide road racing circuit
      through a city in daylight.
