    Onboard footage of a taxi driving through a harbor market town. Brick market halls,
    green awnings, cafes, street trees, iron lamps, dock cranes and ferry terminals.
    Asphalt, concrete curbs and sidewalks. Vehicle bonnet visible. The view follows the
    steering and movement of the car.
