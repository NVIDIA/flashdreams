schema_version: 1
map:
  path: ../maps/boulevard_district.robotaxi.yaml
  camera: camera_front_wide_120fov
  variant: default
  force_recompile: false
  preload_maps: false
world_model:
  backend: omnidreams
  manifest: example_world_model.yaml
  offload_text_encoder: false
  model_preset: standard
  device: cuda
  compile: null
  profile_pipeline: false
rendering:
  raster:
    width: 1280
    height: 704
    near_plane_m: 0.1
    far_plane_m: 200.0
    fog_start_m: 40.0
    fog_end_m: 140.0
    fog_power: 1.5
    triangle_raytrace_distance_m: 25.0
    triangle_raytrace_edge_samples: 8
    lane_segment_interval_m: 0.05
    polyline_segment_interval_m: 0.8
    line_width_px: 12.0
    pole_width_px: 5.0
    dual_line_offset_m: 0.1
  bev:
    enabled: true
    width: 1024
    height: 1024
    height_m: 75.0
    fov_deg: 60.0
    tilt_deg: 0.0
presentation:
  hud_enabled: true
  show_fps: false
  stream_jpeg_quality: 85
  stream_scale: 1.0
wheel:
  enabled: true
  profile: auto
runtime:
  cuda_visible_devices: auto
  profile_world_model: false
  total_blocks: null
  prewarm_blocks: 4
  profile_input_latency: false
