schema_version: 1
default_preset_id: causal-forcing-wan2.1-t2v-1.3b-chunkwise

presets:
  causal-forcing-wan2.1-t2v-1.3b-chunkwise:
    provider: flashdreams.core.pipeline_presets:ObjectGraphPipelineProvider
    runtime:
      prompt: A cinematic waterfall cascading through a lush forest at sunset.
      total_blocks: 60
      pixel_height: 480
      pixel_width: 832
      fps: 16
      output_layout: tchw
    pipeline:
      _target: flashdreams.recipes.wan:WanInferencePipelineConfig
      name: causal-forcing-wan2.1-t2v-1.3b-chunkwise
      enable_sync_and_profile: true
      encoder: null
      text_encoder:
        _target: flashdreams.infra.encoder.text.umt5:UMT5TextEncoderConfig
        model_id_or_local_path: Wan-AI/Wan2.1-T2V-1.3B-Diffusers
      image_encoder: null
      decoder:
        _target: flashdreams.recipes.wan:WanVAEDecoderConfig
        checkpoint_path: https://huggingface.co/lightx2v/Autoencoders/resolve/main/Wan2.1_VAE.pth
        use_cuda_graph: true
        use_compile: false
      diffusion_model:
        _target: flashdreams.infra.diffusion.model:DiffusionModelConfig
        seed: 42
        context_noise: 0
        noise_in_unpatchified_shape: false
        transformer:
          _target: flashdreams.recipes.wan:Wan21TransformerConfig
          network:
            _target: flashdreams.recipes.wan:WanDiTNetwork1pt3BConfig
            patch_embedding_type: conv3d
            apply_rope_before_kvcache: true
            cp_method: ring
          checkpoint_path: https://huggingface.co/zhuhz22/Causal-Forcing/blob/main/chunkwise/causal_forcing.pt
          checkpoint_min_free_gb: null
          state_dict_transform:
            _ref: flashdreams.core.checkpoint.remap:unwrap_generator_state_dict
          stream_checkpoint: false
          init_device: null
          batch_shape:
            _tuple: []
          len_t: 3
          guidance_scale: 1.0
          window_size_t: 21
          sink_size_t: 0
          h_extrapolation_ratio: 1.0
          w_extrapolation_ratio: 1.0
          compile_network: true
          use_cuda_graph: true
          cuda_graph_warmup_iters: 2
          stamp_image_latent: false
          concat_image_mask_to_latent: false
        scheduler:
          _target: flashdreams.infra.diffusion.scheduler.fm:FlowMatchSchedulerConfig
          num_inference_steps: 4
          denoising_timesteps: [1000, 750, 500, 250]
          warp_denoising_step: true
          shift: 5.0
          sigma_max: 1.0
          sigma_min: 0.0
          extra_one_step: true
          num_train_timesteps: 1000
          enable_tqdm: false

