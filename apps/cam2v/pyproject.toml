[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-cam2v"
version = "0.1.0"
description = "Reusable interactive FlashDreams camera-to-video application primitives"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["flashdreams[local-window,serving,ui]"]

[tool.uv.sources]
flashdreams = { workspace = true }

[tool.setuptools]
packages = ["cam2v"]
package-dir = { cam2v = "." }
