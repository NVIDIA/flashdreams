[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-t2v-demo"
version = "0.1.0"
description = "FlashDreams text-to-video runtime demo launcher"
requires-python = ">=3.10"
dependencies = [
    "flashdreams[serving]",
    "flashdreams-causal-forcing",
    "flashdreams-cosmos-predict2",
    "flashdreams-self-forcing",
    "flashdreams-t2v",
]

[project.entry-points."flashdreams.runner_configs"]
t2v = "t2v_demo.runner:RUNNER_T2V"

[project.entry-points."flashdreams.applications"]
t2v = "t2v_demo.app:create_app"

[tool.uv.sources]
flashdreams = { workspace = true }
flashdreams-causal-forcing = { workspace = true }
flashdreams-cosmos-predict2 = { workspace = true }
flashdreams-self-forcing = { workspace = true }
flashdreams-t2v = { workspace = true }

[tool.setuptools]
packages = ["t2v_demo"]
package-dir = { t2v_demo = "." }

[tool.setuptools.package-data]
t2v_demo = ["web/*.js", "web/*.css"]
