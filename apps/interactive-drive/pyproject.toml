[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-app-interactive-drive"
version = "0.1.0"
description = "Interactive driving demo chrome for the shared local-window presenter."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
# Chrome only: overlays draw with PIL against the shared presentation
# contracts and read their values through callables, so nothing here depends
# on a model. That keeps the package importable by the integration that
# currently owns the engine, without a cycle.
dependencies = [
    "flashdreams[local-window]",
    "loguru>=0.7",
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.scripts]
flashdreams-interactive-drive = "interactive_drive_app.cli:main"

[project.optional-dependencies]
omnidreams = [
    "flashdreams-omnidreams",
]
lingbot = [
    "flashdreams-lingbot",
]
all-models = [
    "flashdreams-lingbot",
    "flashdreams-omnidreams",
]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
flashdreams = { workspace = true }
flashdreams-lingbot = { workspace = true }
flashdreams-omnidreams = { workspace = true }

[tool.setuptools.packages.find]
include = ["interactive_drive_app*"]
