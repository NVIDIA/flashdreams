[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-v2v"
version = "0.1.0"
description = "Reusable transport-neutral FlashDreams video-to-video application primitives"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flashdreams[local-window,serving]",
    "imageio-ffmpeg>=0.5",
    "numpy>=1.26",
    "torch>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
flashdreams = { workspace = true }

[tool.setuptools]
packages = ["v2v"]
package-dir = { v2v = "." }

[tool.uv]
managed = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -p flashdreams._pytest_plugins.marker_enforcement"
markers = [
    "ci_cpu: CPU-safe test, runs on the CPU CI runner",
    "ci_gpu: requires GPU or libGL (cv2), runs on the GPU CI runner",
    "manual: heavy or environment-specific test, opt-in only",
]
