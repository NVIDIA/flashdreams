[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-red-screen"
version = "0.2.0"
description = "Synthetic keyboard-controlled red screen application for FlashDreams."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["flashdreams"]

[tool.uv.sources]
flashdreams = { workspace = true }

[tool.setuptools.packages.find]
include = ["red_screen*"]
