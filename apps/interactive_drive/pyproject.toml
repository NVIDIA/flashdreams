[project]
name = "flashdreams-interactive-drive-v2"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "flashdreams[local-window,serving]",
    "huggingface-hub>=0.33",
    "ludus-renderer",
    "Pillow>=10.0",
]

[project.scripts]
interactive-drive-configuration = "interactive_drive.input_config.app:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
flashdreams = { workspace = true }
ludus-renderer = { workspace = true }

[tool.setuptools.packages.find]
include = ["interactive_drive*"]

[tool.setuptools.package-data]
interactive_drive = [
    "configs/wheels/*.yaml",
    "assets/README.md",
    "assets/wheel_and_pedals/*.png",
    "DRIVING_SUPPORT.md",
    "hdmap.png",
    "screenshot.jpg",
]

[tool.uv]
managed = true
