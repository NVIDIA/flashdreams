[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-t2v"
version = "0.1.0"
description = "Reusable transport-neutral FlashDreams text-to-video application primitives"
requires-python = ">=3.10"
dependencies = ["flashdreams[local-window,serving]"]

[tool.uv.sources]
flashdreams = { workspace = true }

[tool.setuptools]
packages = ["t2v"]
package-dir = { t2v = "." }
