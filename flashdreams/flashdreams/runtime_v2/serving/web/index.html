<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FlashDreams WebRTC</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #111;
        color: #eee;
        font: 16px system-ui, sans-serif;
      }

      #video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      #status {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: 2rem;
        text-align: center;
        white-space: pre-wrap;
        pointer-events: none;
      }

      #status[hidden] {
        display: none;
      }

      #status.error {
        color: #ff8a8a;
      }

      #recording-controls {
        position: fixed;
        top: 16px;
        right: 16px;
        max-width: min(620px, calc(100vw - 32px));
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 12px;
        background: #101c25ed;
        border: 1px solid #34505d;
        border-radius: 10px;
        font-size: 13px;
      }
      #recording-controls[hidden], #recording-download[hidden] { display: none; }
      #recording-controls button, #recording-download {
        padding: 8px 12px;
        border: 1px solid #3f655f;
        border-radius: 6px;
        background: #183e37;
        color: #e6fff7;
        text-decoration: none;
        font: inherit;
        cursor: pointer;
      }
      #recording-controls button:disabled { opacity: .45; cursor: default; }
      #recording-controls :focus-visible { outline: 2px solid #42d9b1; outline-offset: 3px; }
      #recording-status { color: #b7ccd6; overflow-wrap: anywhere; }

    </style>
  </head>
  <body>
    <video id="video" autoplay muted playsinline></video>
    <div id="status" role="status" aria-live="polite">Waiting for the server…</div>
    <section id="recording-controls" aria-label="原始数据录制" lang="zh-CN" hidden>
      <strong>原始数据</strong>
      <button id="recording-start" type="button" disabled>开始录制</button>
      <button id="recording-stop" type="button" disabled>停止并保存</button>
      <a id="recording-download" hidden download>下载 ZIP</a>
      <span id="recording-status" role="status" aria-live="polite">等待应用状态…</span>
    </section>
    <script src="/app.js"></script>
  </body>
</html>
