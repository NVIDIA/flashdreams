<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FlashDreams WebRTC</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #111;
        color: #eee;
        font: 16px system-ui, sans-serif;
      }

      #video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      #status {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: 2rem;
        text-align: center;
        white-space: pre-wrap;
        pointer-events: none;
      }

      #status[hidden] {
        display: none;
      }

      #status.error {
        color: #ff8a8a;
      }

      #input-latency {
        --accent: #8ef01c;
        position: fixed;
        right: clamp(0.75rem, 2vw, 1.25rem);
        bottom: clamp(0.75rem, 2vw, 1.25rem);
        width: min(20rem, calc(100vw - 1.5rem));
        box-sizing: border-box;
        padding: 0.9rem 1rem 0.85rem;
        overflow: hidden;
        border: 1px solid rgb(255 255 255 / 14%);
        border-radius: 0.85rem;
        background:
          linear-gradient(135deg, rgb(142 240 28 / 9%), transparent 42%),
          rgb(12 14 15 / 86%);
        box-shadow:
          0 1.1rem 3rem rgb(0 0 0 / 42%),
          inset 0 1px rgb(255 255 255 / 5%);
        backdrop-filter: blur(1rem) saturate(120%);
        pointer-events: none;
        font-variant-numeric: tabular-nums;
      }

      #input-latency::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 0.2rem;
        background: var(--accent);
        box-shadow: 0 0 1rem color-mix(in srgb, var(--accent) 55%, transparent);
      }

      #input-latency[data-state="pending"] {
        --accent: #ffbf4f;
      }

      #input-latency[data-state="unavailable"] {
        --accent: #9aa3a3;
      }

      .latency-heading,
      .latency-summary,
      .latency-timestamps,
      .latency-percentiles {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.75rem;
      }

      .latency-heading {
        color: #bac2c1;
        font-size: 0.68rem;
        font-weight: 750;
        letter-spacing: 0.14em;
      }

      #latencyEventLabel {
        max-width: 10rem;
        overflow: hidden;
        color: #f3f7f0;
        text-overflow: ellipsis;
        white-space: nowrap;
        letter-spacing: 0.04em;
      }

      .latency-summary {
        margin: 0.35rem 0 0.65rem;
      }

      #latencyValue {
        color: #f7fbf3;
        font-size: clamp(1.65rem, 5vw, 2.2rem);
        font-weight: 720;
        letter-spacing: -0.045em;
        line-height: 1;
        text-shadow: 0 0 1.25rem color-mix(in srgb, var(--accent) 28%, transparent);
      }

      #latencyState {
        color: var(--accent);
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .latency-timestamps {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.2rem 0.8rem;
        padding: 0.55rem 0;
        border-block: 1px solid rgb(255 255 255 / 8%);
        color: #aeb6b5;
        font-size: 0.72rem;
      }

      .latency-timestamps output {
        justify-self: end;
        color: #e8ece7;
      }

      .latency-percentiles {
        justify-content: flex-start;
        margin-top: 0.55rem;
        color: #8f9897;
        font-size: 0.68rem;
        letter-spacing: 0.04em;
      }

      .latency-percentiles strong {
        margin-left: 0.15rem;
        color: #dbe1da;
        font-weight: 650;
      }

      #latencyDetail {
        min-width: 0;
        margin-left: auto;
        overflow: hidden;
        color: #9fa8a7;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      @media (max-width: 34rem) {
        #input-latency {
          padding: 0.75rem 0.85rem;
        }

        .latency-timestamps {
          display: none;
        }
      }

      @media (prefers-reduced-transparency: reduce) {
        #input-latency {
          background: #0c0e0f;
          backdrop-filter: none;
        }
      }
    </style>
  </head>
  <body>
    <video id="video" autoplay muted playsinline></video>
    <div id="status" role="status" aria-live="polite">Waiting for the server…</div>
    <aside
      id="input-latency"
      data-state="unavailable"
      aria-label="Input to presented-frame latency"
    >
      <div class="latency-heading">
        <span>INPUT → PRESENTED FRAME</span>
        <span id="latencyEventLabel">NO EVENT</span>
      </div>
      <div class="latency-summary">
        <output id="latencyValue">— ms</output>
        <span id="latencyState">Unavailable</span>
      </div>
      <div class="latency-timestamps">
        <span>Browser event</span>
        <output id="latencyEventTime">—</output>
        <span>Presented frame</span>
        <output id="latencyFrameTime">—</output>
      </div>
      <div class="latency-percentiles">
        <span>P50 <strong id="latencyP50">—</strong></span>
        <span>P90 <strong id="latencyP90">—</strong></span>
        <span id="latencyDetail">Waiting for input</span>
      </div>
    </aside>
    <script src="/app.js"></script>
  </body>
</html>
