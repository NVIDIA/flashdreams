<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FlashDreams WebRTC</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #111;
        color: #eee;
        font: 16px system-ui, sans-serif;
      }

      #video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      #status {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: 2rem;
        text-align: center;
        white-space: pre-wrap;
        pointer-events: none;
      }

      #status[hidden] {
        display: none;
      }

      #status.error {
        color: #ff8a8a;
      }
    </style>
  </head>
  <body>
    <video id="video" autoplay muted playsinline></video>
    <div id="status" role="status" aria-live="polite">Waiting for the server…</div>
    <script src="/app.js"></script>
  </body>
</html>
