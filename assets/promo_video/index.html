<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="assets/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      .grid-video {
        position: absolute;
        width: 640px;
        height: 360px;
        object-fit: cover;
        border-radius: 0;
        border: 1px solid rgba(255, 255, 255, 0.06);
        background: #050505;
        z-index: 10;
        transform: translateZ(0);
      }

      .grid-inset-video {
        position: absolute;
        width: 200px;
        height: 100px;
        object-fit: cover;
        border-radius: 10px;
        border: 2px solid rgba(255, 255, 255, 0.88);
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
        background: #000;
        z-index: 30;
        transform: translateZ(0);
      }

      .interactive-full-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .inset-lingbot {
        left: 1068px;
        top: 248px;
      }

      .inset-flashvsr {
        left: 1708px;
        top: 608px;
      }

      .c1 { left: 0; }
      .c2 { left: 640px; }
      .c3 { left: 1280px; }
      .r1 { top: 0; }
      .r2 { top: 360px; }
      .r3 { top: 720px; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
