<!DOCTYPE html>
<!-- THROWAWAY spike (caption WebGPU de-risk) -- NOT product code. Delete before any PR. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Caption model — onnxruntime-web / WebGPU smoke test</title>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.webgpu.min.js"></script>
  <style>
    body { font-family: ui-monospace, Menlo, Consolas, monospace; padding: 24px; max-width: 820px; }
    h3 { margin: 0 0 4px; }
    p { color: #555; margin: 2px 0 16px; }
    button { font: inherit; padding: 8px 16px; cursor: pointer; }
    pre { background: #f5f6f4; border: 1px solid #e1e5db; border-radius: 8px; padding: 14px; white-space: pre-wrap; margin-top: 14px; }
    .ok { color: #5a8c00; }
    .bad { color: #c0392b; }
    .dim { color: #777; }
  </style>
</head>
<body>
  <h3>Caption model — WebGPU smoke test</h3>
  <p>Proves the latent→caption‑bank classifier runs on onnxruntime‑web / WebGPU. Random weights → the caption is meaningless; only the <em>op coverage + shapes</em> matter.</p>
  <button id="run">Run smoke test</button>
  <pre id="log"></pre>
  <script>
    const ORT_VER = "1.20.1"
    ort.env.wasm.wasmPaths = `https://cdn.jsdelivr.net/npm/onnxruntime-web@${ORT_VER}/dist/`
    ort.env.logLevel = "warning"

    const logEl = document.getElementById("log")
    const log = (msg, cls = "") => {
      logEl.innerHTML += `<span class="${cls}">${msg}</span>\n`
    }

    document.getElementById("run").onclick = async () => {
      logEl.textContent = ""
      try {
        if (!navigator.gpu) {
          log("navigator.gpu is undefined — open over a secure context", "bad")
          log("(http://localhost or https; e.g. an SSH tunnel to the RTX box)", "dim")
          return
        }
        const adapter = await navigator.gpu.requestAdapter()
        log("WebGPU adapter: " + (adapter ? "available ✓" : "NONE"), adapter ? "ok" : "bad")
        if (!adapter) return

        log("loading spec + creating InferenceSession on WebGPU…")
        const spec = await (await fetch("./caption_model.fp32.spec.json")).json()
        const session = await ort.InferenceSession.create("./caption_model.fp32.onnx", {
          executionProviders: ["webgpu"],
          graphOptimizationLevel: "all",
        })
        log(`session created ✓  inputs=${JSON.stringify(session.inputNames)} outputs=${JSON.stringify(session.outputNames)}`, "ok")

        const shape = spec.input_shape // [1, Twin, 16, 88, 160]
        const n = shape.reduce((a, b) => a * b, 1)
        const data = new Float32Array(n)
        for (let i = 0; i < n; i += 1) data[i] = Math.random() * 2 - 1
        const feeds = { [session.inputNames[0]]: new ort.Tensor("float32", data, shape) }

        log(`input ${JSON.stringify(shape)} (${(n * 4 / 1e6).toFixed(2)} MB) — warmup…`)
        await session.run(feeds) // compile shaders / autotune
        const t0 = performance.now()
        const res = await session.run(feeds)
        const ms = performance.now() - t0
        const logits = res[session.outputNames[0]]
        let best = 0
        for (let i = 1; i < logits.data.length; i += 1) {
          if (logits.data[i] > logits.data[best]) best = i
        }
        log(`run ✓  ${session.outputNames[0]} dims=${JSON.stringify(logits.dims)}  ${ms.toFixed(1)} ms`, "ok")
        log(`argmax=${best}  →  "${spec.caption_bank?.[best] ?? "?"}"  (random weights)`, "dim")
        log("WebGPU op coverage OK — this architecture is browser‑runnable ✓", "ok")
      } catch (err) {
        log("FAILED: " + (err.message || err), "bad")
        log("If it names an unsupported op, we factorize the backbone and retry.", "dim")
        console.error(err)
      }
    }
  </script>
</body>
</html>
