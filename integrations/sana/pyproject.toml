[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-sana-wm"
version = "0.1.0"
description = "SANA-WM bidirectional world-model integration for flashdreams."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.0",
    "diffusers>=0.36",
    "flashdreams",
    "imageio[ffmpeg]>=2.31",
    "Pillow>=10",
    "PyYAML>=6.0",
    "safetensors>=0.5",
    "sentencepiece>=0.2",
    "torchvision>=0.26",
    "transformers>=5.0,<6",
]

[tool.uv.sources]
flashdreams = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.entry-points."flashdreams.runner_configs"]
"sana-wm-bidirectional" = "sana_wm.config:RUNNER_SANA_WM_BIDIRECTIONAL"
"sana-wm-streaming" = "sana_wm.config:RUNNER_SANA_WM_STREAMING"

[tool.setuptools.packages.find]
include = ["sana_wm*"]
exclude = ["tests"]

[tool.uv]
managed = true
