<text x="621.5" y="597.2" class="value" text-anchor="middle">18.8</text>
<text x="621.5" y="670" class="axis" text-anchor="middle">E0</text>
<rect x="668.0" y="512.3" width="43.0" height="137.7" fill="#4e79a7"/>
<text x="689.5" y="505.3" class="value" text-anchor="middle">56.5</text>
<text x="689.5" y="670" class="axis" text-anchor="middle">D1</text>
<rect x="736.0" y="512.3" width="43.0" height="137.7" fill="#4e79a7"/>
<text x="757.5" y="505.3" class="value" text-anchor="middle">56.5</text>
<text x="757.5" y="670" class="axis" text-anchor="middle">D2</text>
<rect x="804.0" y="512.7" width="43.0" height="137.3" fill="#4e79a7"/>
<text x="825.5" y="505.7" class="value" text-anchor="middle">56.3</text>
<text x="825.5" y="670" class="axis" text-anchor="middle">D3</text>
<rect x="872.0" y="512.7" width="43.0" height="137.3" fill="#4e79a7"/>
<text x="893.5" y="505.7" class="value" text-anchor="middle">56.3</text>
<text x="893.5" y="670" class="axis" text-anchor="middle">D4</text>
<rect x="940.0" y="512.3" width="43.0" height="137.7" fill="#4e79a7"/>
<text x="961.5" y="505.3" class="value" text-anchor="middle">56.5</text>
<text x="961.5" y="670" class="axis" text-anchor="middle">D5</text>
<rect x="1008.0" y="512.3" width="43.0" height="137.7" fill="#4e79a7"/>
<text x="1029.5" y="505.3" class="value" text-anchor="middle">56.5</text>
<text x="1029.5" y="670" class="axis" text-anchor="middle">D6</text>
<rect x="1076.0" y="643.5" width="43.0" height="6.5" fill="#f28e2b"/>
