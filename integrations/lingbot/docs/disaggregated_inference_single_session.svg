<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title description">
<title id="title">LingBot single-session context-parallel wall time and GPU memory</title>
<desc id="description">Median wall-time components and per-rank peak allocated memory for CP1, CP4 Ulysses, and CP6 ring.</desc>
<style>
text{font-family:Inter,Arial,sans-serif;fill:#202124}
.title{font-size:26px;font-weight:600}.subtitle{font-size:15px;fill:#5f6368}
.axis{font-size:12px;fill:#5f6368}.label{font-size:15px;font-weight:600}
.value{font-size:12px;font-weight:600}.grid{stroke:#dadce0;stroke-width:1}
</style>
<rect width="1200" height="780" fill="#ffffff"/>
<text x="40" y="42" class="title">LingBot minimum single-session latency</text>
<text x="40" y="68" class="subtitle">H100 80 GB · BF16 · 832×464 · six warmup and five measured blocks</text>
