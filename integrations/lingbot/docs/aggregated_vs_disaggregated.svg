<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
<title id="title">LingBot disaggregated CP6 and aggregated CP8 performance comparison</title>
<desc id="description">Median per-chunk component wall time and per-rank peak allocated HBM on eight H100 GPUs.</desc>
<style>
text{font-family:Inter,Arial,sans-serif;fill:#202124}
.title{font-size:26px;font-weight:600}.subtitle{font-size:15px;fill:#5f6368}
.axis{font-size:12px;fill:#5f6368}.label{font-size:14px;font-weight:600}
.value{font-size:12px;font-weight:600}.grid{stroke:#dadce0;stroke-width:1}
</style>
