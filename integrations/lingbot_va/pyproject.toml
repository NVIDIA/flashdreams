[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-lingbot-va"
version = "0.1.0"
description = "LingBot-VA Robotwin I2AV model integration for FlashDreams V2 applications."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flashdreams",
    # The engine uses Wan VAE private streaming fields; retest before widening.
    "diffusers>=0.38,<0.39",
    "einops",
    "Pillow>=10",
    "transformers>=5.0,<6",
]

[tool.uv.sources]
flashdreams = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["lingbot_va*"]
exclude = ["tests"]

[tool.uv]
managed = true
