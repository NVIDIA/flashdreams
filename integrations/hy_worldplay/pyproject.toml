[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-hy-worldplay"
version = "0.1.0a1"
description = "HY-WorldPlay (HY-World 1.5) interactive world model integration for flashdreams (WAN 2.2 5B I2V variant)."
readme = "README.md"
requires-python = ">=3.12"
# The upstream HY-WorldPlay model code (``hyvideo/`` and ``wan/``) lives in
# https://github.com/Tencent-Hunyuan/HY-WorldPlay and is *not* on PyPI.
# The recipe wrapper here only provides the flashdreams-side configs +
# runner; the upstream tree is provisioned by the parity-check script and,
# for in-tree slugs, must be installed separately into the venv:
#
#     uv pip install --no-build-isolation -e <path-to-HY-WorldPlay>
#
# We therefore deliberately do NOT list HY-WorldPlay as a dependency here
# (its ``requirements.txt`` pulls heavyweight, version-pinned scientific
# stacks that would conflict with flashdreams' resolved env).
dependencies = [
    "flashdreams",
    "diffusers>=0.34",
    "imageio[ffmpeg]>=2.31",
    "mediapy>=1.1",
    "moviepy>=1.0,<2",
    "opencv-python-headless",
    "scipy>=1.11",
    "tyro>=0.8",
]

[tool.uv.sources]
flashdreams = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Optional extra needed only when *running* the HY-WorldPlay upstream code
# in-process from the flashdreams main venv (i.e. `python -m hy_worldplay.cli`).
# Not required for smoke tests, ``flashdreams-run`` non-HY runners, or the
# parity-check (which has its own isolated venv -- see
# ``tests/parity_check/pyproject.toml``).
#
# These are kept optional because:
#   * ``sageattention`` builds CUDA kernels and pins a specific torch range,
#     which can destabilise the carefully-curated flashdreams main venv on
#     bleeding-edge GPUs (e.g. Blackwell sm_120 wheels lag PyPI).
#   * The rest are vLLM-style platform plumbing that only matter once the
#     upstream ``wan`` package is imported.
#
# Install once before running the in-process CLI::
#
#     uv pip install --no-build-isolation -e \
#         'integrations/hy_worldplay[upstream]'
upstream = [
    # Required for diffusers' ``low_cpu_mem_usage=True`` path; the Wan VAE
    # has ``keep_in_fp32_modules=True`` and diffusers raises a ValueError
    # if it can't enable low-CPU-mem loading (which needs accelerate).
    "accelerate>=0.30",
    "cloudpickle",
    "filelock",
    "pyyaml",
    "remote-pdb",
    "sageattention",
]

# Phase-1: standalone CLI entry point only. Once the recipe-level
# integration lands (see README.md "Staging plan"), this will switch to
# the ``flashdreams.runner_configs`` entry-point group used by
# ``self_forcing`` / ``causal_forcing`` / ``wan21`` so the same slug
# becomes a ``flashdreams-run hy-worldplay-wan-i2v-5b`` subcommand.
[project.scripts]
hy-worldplay-wan-i2v-5b = "hy_worldplay.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["hy_worldplay*"]
exclude = ["tests"]
