[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-realesrgan"
version = "0.1.0"
description = "Real-ESRGAN frame and video upsampler integration for flashdreams."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flashdreams[serving]",
    "opencv-python-headless>=4.8",
]

[tool.uv]
managed = true

[tool.uv.sources]
flashdreams = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
realesrgan-upsample = "realesrgan.cli:main"
uplift-server = "realesrgan.grpc.uplift_server:main"

[project.entry-points."flashdreams.postprocess_presets"]
realesrgan = "realesrgan.postprocess:POSTPROCESS_PRESET_REALESRGAN"

[tool.setuptools.packages.find]
include = ["realesrgan*"]
exclude = ["tests"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -p flashdreams._pytest_plugins.marker_enforcement"
markers = [
    "ci_cpu: CPU-safe test, runs on the CPU CI runner",
    "ci_gpu: requires GPU or libGL (cv2), runs on the GPU CI runner",
    "manual: heavy or environment-specific test, opt-in only",
]
