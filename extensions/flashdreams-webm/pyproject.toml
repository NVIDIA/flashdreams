[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "flashdreams-webm"
version = "0.1.0"
description = "Native VP8/VP9, Opus, and WebM output companion for FlashDreams"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["licenses/*"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
]

[project.scripts]
flashdreams-webm-benchmark = "flashdreams_webm.benchmark:main"

[project.urls]
Homepage = "https://github.com/NVIDIA/flashdreams"
Repository = "https://github.com/NVIDIA/flashdreams"

[tool.scikit-build]
cmake.version = ">=3.24"
cmake.build-type = "Release"
install.components = ["flashdreams_webm"]
wheel.packages = ["src/flashdreams_webm"]
sdist.include = [
    "CMakeLists.txt",
    "src/native/*.cpp",
    "src/native/*.h",
    "src/flashdreams_webm/*.py",
    "src/flashdreams_webm/*.pyi",
    "tests/*.py",
    "licenses/*",
]
