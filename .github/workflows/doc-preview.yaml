name: Docs preview

# Everything preview-related for the docs site, split out from `doc.yml` (which
# only handles the production publish to `gh-pages`). Two jobs:
#   - preview              per-PR doc preview (deploy on open/sync, remove on close)
#   - consolidated-preview a single preview stacking all topic branches
# Neither ever publishes production docs — they only write under
# `gh-pages:pr-preview/`.
on:
  pull_request:
    # Globs cover any sub-branch off the public-website integration line.
    # Two conventions coexist today: the older `dev/aidanf/flashdreams-site-*`
    # (`-site` itself, `-site-merge`, `-site-placeholders`) and the newer
    # path-style `dev/aidanf/flashdreams_site/*` (e.g. `flashdreams_site/community`
    # for the community-area topic branch). Both shapes are matched so
    # topic-branch PRs into either set get preview builds.
    branches:
      - main
      - 'dev/aidanf/flashdreams-site*'
      - 'dev/aidanf/flashdreams_site/*'
    # `closed` is included so the cleanup step (rossjrw/pr-preview-action in
    # `auto` mode) can remove the published preview when a PR is merged or
    # abandoned. The other three are the default `pull_request` set.
    types: [opened, reopened, synchronize, closed]
  push:
    # The two site branches drive the consolidated preview: a push to the
    # integration line (`dev/aidanf/flashdreams-site`) or any topic branch
    # (`dev/aidanf/flashdreams_site/*`) rebuilds it.
    branches:
      - 'dev/aidanf/flashdreams-site'
      - 'dev/aidanf/flashdreams_site/*'
  workflow_dispatch:

permissions:
  contents: write
  # Lets `rossjrw/pr-preview-action` post / update the sticky preview-URL
  # comment on the PR.
  pull-requests: write

# Serialize runs that target the same ref so a fast follow-up push to a PR
# can't race its own previous preview deploy.
concurrency:
  group: docs-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Per-PR preview. Builds the docs (which also validates they compile on PRs)
  # and hands `_build/` to rossjrw/pr-preview-action in `auto` mode:
  #   - opened/reopened/synchronize → publish to `gh-pages:pr-preview/pr-<N>/`
  #     and post/update a sticky comment with the preview URL.
  #   - closed → delete that subdirectory from `gh-pages`.
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # On `pull_request: closed` we only need to remove the existing preview,
      # so every build-side step is gated with `if: github.event.action !=
      # 'closed'`. The `rossjrw/pr-preview-action` step below runs
      # unconditionally and picks deploy-vs-remove from the event action.
      #
      # `actions/checkout` is the exception: it runs on `closed` too. The
      # cleanup path delegates to `JamesIves/github-pages-deploy-action`, which
      # operates on the runner workspace and aborts with "fatal: not in a git
      # directory" if the workspace was never checked out. We skip the submodule
      # fetch on `closed` (the removal doesn't need them).
      - uses: actions/checkout@v4
        with:
          submodules: ${{ github.event.action == 'closed' && 'false' || 'recursive' }}

      - uses: astral-sh/setup-uv@v4
        if: github.event.action != 'closed'

      # The doc build only needs `flashdreams` to be importable. The heavy
      # GPU stack (transformer-engine, pynvml, cv2, mediapy, boto3/botocore)
      # is mocked via `autodoc_mock_imports` in `docs/source/conf.py`, so we
      # install only the Sphinx toolchain + a minimal CPU-only dep set.
      - name: Install dependencies
        if: github.event.action != 'closed'
        env:
          # Pull torch/torchvision from PyTorch's CPU-only index.
          UV_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
          UV_INDEX_STRATEGY: unsafe-best-match
        run: |
          uv sync --only-group docs --only-group docs-ci --python 3.12
          uv pip install --no-deps ./flashdreams

      # Render the banner as `pr-<number>` so a reviewer opening the preview URL
      # immediately sees they're not on a stable doc.
      - name: Override version for PR previews
        if: github.event.action != 'closed'
        run: |
          sed -i 's/^__version__ = ".*"/__version__ = "pr-${{ github.event.number }}"/' flashdreams/flashdreams/_version.py

      # --no-project: the "Override version" step above rewrites the version
      # field to a non-PEP-440 string; without it uv would try to parse the
      # workspace pyproject.toml and fail.
      - name: Sphinx build
        if: github.event.action != 'closed'
        run: |
          uv run --no-project sphinx-build -W -b html docs/source _build

      # The umbrella-dir (`pr-preview/`) is sibling to `main/` and `versions/`,
      # and the production deploy in `doc.yml` uses `keep_files: false` scoped to
      # its own destination_dir, so previews and stable docs don't clobber each
      # other.
      #
      # PRs from forks: the GITHUB_TOKEN is read-only on fork PRs, so this step
      # will fail to push. That's expected — same-repo branches get previews;
      # fork PRs don't.
      - name: Deploy PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./_build
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto

  # Build a single preview that stacks every `dev/aidanf/flashdreams_site/*`
  # topic branch on top of the `dev/aidanf/flashdreams-site` integration line,
  # so reviewers see the combined site without opening N preview tabs. Triggered
  # by pushes to any of those branches (and manual runs). Branches that conflict
  # are skipped — not fatal — and reported in the job summary. Published to
  # `gh-pages:pr-preview/consolidated/`, a sibling of the per-PR previews that
  # the sweep above leaves alone (it only removes numeric `pr-<N>` dirs).
  consolidated-preview:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/dev/aidanf/flashdreams-site' ||
        startsWith(github.ref, 'refs/heads/dev/aidanf/flashdreams_site/')))
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-mutation
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/aidanf/flashdreams-site
          fetch-depth: 0
          submodules: recursive

      - name: Merge all flashdreams_site/* topic branches
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          # Refresh the topic-branch remote refs (checkout fetched only -site).
          git fetch origin --no-tags \
            "+refs/heads/dev/aidanf/flashdreams_site/*:refs/remotes/origin/dev/aidanf/flashdreams_site/*"

          merged=()
          skipped=()
          for ref in $(git for-each-ref --format='%(refname)' \
              'refs/remotes/origin/dev/aidanf/flashdreams_site/*'); do
            branch=${ref#refs/remotes/}
            if git merge --no-edit "$ref"; then
              merged+=("$branch")
            else
              git merge --abort
              skipped+=("$branch")
            fi
          done

          {
            echo "## Consolidated site preview"
            echo ""
            echo "Base: \`dev/aidanf/flashdreams-site\`"
            echo ""
            echo "### Merged (${#merged[@]})"
            for b in "${merged[@]:-}"; do [ -n "$b" ] && echo "- \`$b\`"; done
            echo ""
            echo "### Skipped — merge conflict (${#skipped[@]})"
            for b in "${skipped[@]:-}"; do [ -n "$b" ] && echo "- \`$b\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: astral-sh/setup-uv@v4

      # Mirrors the `preview` job's minimal CPU-only install.
      - name: Install dependencies
        env:
          UV_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
          UV_INDEX_STRATEGY: unsafe-best-match
        run: |
          uv sync --only-group docs --only-group docs-ci --python 3.12
          uv pip install --no-deps ./flashdreams

      - name: Override version banner
        run: |
          sed -i 's/^__version__ = ".*"/__version__ = "consolidated-site"/' flashdreams/flashdreams/_version.py

      - name: Sphinx build
        run: |
          uv run --no-project sphinx-build -W -b html docs/source _build

      # Publish under a fixed `pr-preview/consolidated/` dir. `keep_files: false`
      # is scoped to destination_dir, so this never clobbers the per-PR previews,
      # `main/`, or `versions/`.
      - name: Deploy consolidated preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _build
          destination_dir: pr-preview/consolidated
          keep_files: false
